# Windows package of PitchSense, built on a GitHub-hosted Windows machine: neither PyInstaller nor
# Tauri cross-compiles, and the macOS package is built on a Mac with `python packaging/build.py`.
# The job runs both test suites on Windows, builds the server and the window's installer, lets
# the packaged server download the season in progress (--update) and run its self-test, installs
# the package silently and runs the self-test of the installed server, and keeps the installer
# as a downloadable artifact.
name: Windows package

on:
  workflow_dispatch:  # Actions page: "Windows package" -> "Run workflow"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          rustup update stable
          cd web
          npm ci

      - name: Test
        run: python -m pytest

      - name: Test the web interface
        run: |
          cd web
          npm test
          npm run build

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Build the package
        run: python packaging/build.py

      - name: Update the season in progress from the packaged server
        run: dist\pitchsense-server\pitchsense-server.exe --update

      - name: Self-test the packaged server
        run: dist\pitchsense-server\pitchsense-server.exe --self-test

      - name: Install the package and self-test the installed server
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\PitchSense-*-Windows-*-setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          Get-ChildItem "$env:ProgramFiles\PitchSense" -Name
          & "$env:ProgramFiles\PitchSense\server\pitchsense-server.exe" --self-test
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        with:
          name: PitchSense-Windows
          path: dist/PitchSense-*-Windows-*-setup.exe
          if-no-files-found: error
          retention-days: 30
