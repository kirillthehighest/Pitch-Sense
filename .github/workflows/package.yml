# Windows package of PitchSense, built on a GitHub-hosted Windows machine: PyInstaller does not
# cross-compile, and the macOS package is built on a Mac with `python packaging/build.py`.
# The job runs the whole test suite on Windows, builds the package, runs the packaged
# application's self-test and keeps the .zip as a downloadable artifact.
name: Windows package

on:
  workflow_dispatch:  # Actions page: "Windows package" -> "Run workflow"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Build the package
        run: python packaging/build.py

      - name: Self-test the packaged application
        shell: pwsh
        run: |
          $test = Start-Process -FilePath dist\PitchSense\PitchSense.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\PitchSense\self-test.txt"
          exit $test.ExitCode

      - uses: actions/upload-artifact@v7
        with:
          name: PitchSense-Windows
          path: dist/PitchSense-*-Windows-*.zip
          if-no-files-found: error
          retention-days: 30
