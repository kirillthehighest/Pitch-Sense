[package]
name = "pitchsense"
version = "0.5.0"
description = "The desktop window of PitchSense: the web interface over the Python server (Phase 22)."
authors = ["Goroșevschi Chiril", "Cuzmici Nicolae", "Păstru Alina"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "pitchsense_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
