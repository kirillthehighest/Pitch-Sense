[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchsense"
dynamic = ["version"]  # app.__version__, see [tool.setuptools.dynamic]
description = "Desktop application for football match analysis and outcome prediction (UTM, APA course project)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Goroșevschi Chiril" },
    { name = "Cuzmici Nicolae" },
    { name = "Păstru Alina" },
]
# Exact pins: upgrade deliberately and run the full test suite afterwards.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "fastapi==0.143.2",  # the local server the web interface reads (Phase 22)
    "uvicorn==0.54.0",  # runs that server
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pyinstaller==6.22.3",  # builds the macOS and Windows packages (Phase 14)
    "httpx2==2.13.1",  # the test client of FastAPI (Starlette 1.8 asks for it; Phase 22)
]
# Only for tools/crests.py and tools/stadiums.py, run by hand: Qt resizes the images and draws
# the sheets they are checked on (the PySide6 window itself was removed in Phase 22).
tools = ["PySide6-Essentials==6.11.2"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
